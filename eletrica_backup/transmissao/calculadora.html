<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Linha de Transmissão</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.min.js"></script>
</head>
<body>
    <main class="calculator-container">
        <h1>Calculadora de Linha de Transmissão</h1>

        <section class="input-section">
            <h2>Parâmetros da Linha</h2>
            <form id="lineParams">
                <div class="form-group">
                    <label for="R">Resistência (Ω/km):</label>
                    <input type="number" id="R" step="0.0001" value="0.0177201">
                </div>

                <div class="form-group">
                    <label for="L">Indutância (mH/km):</label>
                    <input type="number" id="L" step="0.000001" value="0.704685">
                </div>

                <div class="form-group">
                    <label for="C">Capacitância (μF/km):</label>
                    <input type="number" id="C" step="0.000001" value="0.01622637">
                </div>

                <div class="form-group">
                    <label for="length">Comprimento da linha (km):</label>
                    <input type="number" id="length" value="250">
                </div>

                <div class="form-group">
                    <label for="V_nominal">Tensão nominal (kV):</label>
                    <input type="number" id="V_nominal" value="345">
                </div>

                <div class="form-group">
                    <label for="fp_carga">Fator de potência:</label>
                    <input type="number" id="fp_carga" step="0.01" min="0" max="1" value="0.9">
                </div>

                <button type="button" onclick="calcularLinha()">Calcular</button>
            </form>
        </section>

        <section class="results-section">
            <h2>Resultados</h2>
            <div id="results">
                <h3>Parâmetros Básicos</h3>
                <div id="basic-params"></div>

                <h3>Parâmetros do Quadripolo</h3>
                <div id="quadripole-params"></div>

                <h3>Análise sem Compensação</h3>
                <div id="no-comp-analysis"></div>

                <h3>Análise com Compensação Série</h3>
                <div id="series-comp-analysis"></div>

                <h3>Resumo Comparativo</h3>
                <div id="comparative-summary"></div>

                <h3>Observações Técnicas</h3>
                <div id="technical-notes"></div>
            </div>
        </section>
    </main>

    <script>
        function calcularLinha() {
            // Get input values
            const R = parseFloat(document.getElementById('R').value);
            const L = parseFloat(document.getElementById('L').value) * 1e-3; // Convert mH to H
            const C = parseFloat(document.getElementById('C').value) * 1e-6; // Convert μF to F
            const length = parseFloat(document.getElementById('length').value);
            const V_nominal = parseFloat(document.getElementById('V_nominal').value);
            const fp_carga = parseFloat(document.getElementById('fp_carga').value);

            // Basic calculations
            const f = 60;
            const omega = 2 * Math.PI * f;

            // Calculate and display results
            const basicParams = document.getElementById('basic-params');
            basicParams.innerHTML = `
                <p>Frequência: ${f} Hz</p>
                <p>Comprimento da linha: ${length} km</p>
                <p>Tensão nominal: ${V_nominal} kV</p>
            `;

            // Impedância e admitância por unidade de comprimento
            const Z_linha = math.complex(R, omega * L);  // [Ω/km]
            const Y_linha = math.complex(0, omega * C);  // [S/km]

            // Impedância e admitância total da linha
            const Z_total = math.multiply(Z_linha, length);       // [Ω]
            const Y_total = math.multiply(Y_linha, length);       // [S]

            // Impedância característica
            const Z0 = math.sqrt(math.divide(Z_linha, Y_linha));  // [Ω]

            // Constante de propagação
            const gamma = math.sqrt(math.multiply(Z_linha, Y_linha));  // [1/km]
            const gamma_L = math.multiply(gamma, length);             // [adimensional]

            // Velocidade de propagação
            const v_prop = 1 / math.sqrt(math.multiply(L, C));       // [m/s]
            const comprimento_onda = v_prop / f;       // [m]

            // Potência natural (SIL - Surge Impedance Loading)
            const P_natural = math.divide(math.pow(V_nominal * 1000, 2), math.multiply(abs(Z0), 1e6));  // [MW]

            // Display basic parameters results
            basicParams.innerHTML += `
                <p>R = ${R.toFixed(6)} Ω/km</p>
                <p>L = ${(L * 1000).toFixed(6)} mH/km</p>
                <p>C = ${(C * 1e6).toFixed(6)} μF/km</p>
                <p>Z linha = ${math.abs(Z_linha).toFixed(3)} ∠ ${math.degrees(math.phase(Z_linha)).toFixed(3)}° Ω/km</p>
                <p>Y linha = ${(math.abs(Y_linha) * 1e6).toFixed(3)} ∠ ${math.degrees(math.phase(Y_linha)).toFixed(3)}° μS/km</p>
                <p>Impedância característica (Z₀): ${math.abs(Z0).toFixed(3)} ∠ ${math.degrees(math.phase(Z0)).toFixed(3)}° Ω</p>
                <p>Constante de propagação (γ): ${math.abs(gamma) * 1000.toFixed(6)} ∠ ${math.degrees(math.phase(gamma)).toFixed(3)}° × 10⁻³ /km</p>
                <p>Velocidade de propagação: ${v_prop / 1000} km/s</p>
                <p>Comprimento de onda: ${comprimento_onda / 1000} km</p>
                <p>Potência natural (SIL): ${P_natural.toFixed(1)} MW</p>
            `;

            // Parâmetros ABCD do quadripolo
            const A = math.cosh(gamma_L);
            const B = math.multiply(Z0, math.sinh(gamma_L));
            const C = math.divide(math.sinh(gamma_L), Z0);
            const D = math.cosh(gamma_L);  // D = A para linha simétrica

            // Verificação: AD - BC = 1 (propriedade do quadripolo)
            const verificacao = math.subtract(math.multiply(A, D), math.multiply(B, C));

            // Display quadripole parameters results
            const quadripoleParams = document.getElementById('quadripole-params');
            quadripoleParams.innerHTML = `
                <p>A = ${A.re.toFixed(8)} + j${A.im.toFixed(8)}</p>
                <p>B = ${B.re.toFixed(3)} + j${B.im.toFixed(3)} Ω</p>
                <p>C = ${(C.re * 1e6).toFixed(6)} + j${(C.im * 1e6).toFixed(6)} × 10⁻⁶ S</p>
                <p>D = ${D.re.toFixed(8)} + j${D.im.toFixed(8)}</p>
                <p>Verificação AD - BC = ${verificacao.toFixed(8)} (deve ser ≈ 1)</p>
            `;

            // Tensões complexas (usando tensão de linha)
            const V_s = V_transmissor * 1000 / Math.sqrt(3);  // Tensão fase-neutro transmissor [V]
            const V_r = V_receptor * 1000 / Math.sqrt(3);     // Tensão fase-neutro receptor [V]

            // Considerando ângulo de potência
            const V_s_complex = math.multiply(V_s, math.exp(math.complex(0, delta_rad)));
            const V_r_complex = math.multiply(V_r, math.exp(math.complex(0, 0)));  // Referência

            // Corrente no receptor (assumindo carga indutiva)
            // Para uma análise inicial, vamos calcular a corrente baseada no fluxo de potência
            const P_carga_MW = 200;  // Potência ativa da carga [MW] - exemplo
            const Q_carga_MVAr = P_carga_MW * Math.tan(phi_carga);  // Potência reativa [MVAr]

            const S_carga = math.multiply(complex(P_carga_MW, Q_carga_MVAr), 1e6);  // [VA]
            const I_r_complex = math.conj(math.divide(S_carga, math.multiply(3, V_r_complex)));  // Corrente no receptor [A]

            // Usando equações do quadripolo: V_s = A*V_r + B*I_r
            const I_s_complex = math.divide(math.subtract(V_s_complex, math.multiply(A, V_r_complex)), B);  // Corrente no transmissor [A]

            // Potências no transmissor
            const S_s = math.multiply(3, V_s_complex, math.conj(I_s_complex));  // [VA]
            const P_s = S_s.re / 1e6;  // [MW]
            const Q_s = S_s.im / 1e6;  // [MVAr]

            // Perdas na linha
            const P_perdas = P_s - P_carga_MW;
            const Q_perdas = Q_s - Q_carga_MVAr;

            // Rendimento
            const rendimento = (P_carga_MW / P_s) * 100;

            // Display no compensation analysis results
            const noCompAnalysis = document.getElementById('no-comp-analysis');
            noCompAnalysis.innerHTML = `
                <p>Tensão no transmissor: ${(abs(V_s_complex) / 1000 * Math.sqrt(3)).toFixed(3)} kV</p>
                <p>Tensão no receptor: ${(abs(V_r_complex) / 1000 * Math.sqrt(3)).toFixed(3)} kV</p>
                <p>Ângulo de potência: ${delta_graus}°</p>
                <p>Corrente no transmissor: ${abs(I_s_complex).toFixed(3)} ∠ ${math.degrees(math.phase(I_s_complex)).toFixed(3)}° A</p>
                <p>Corrente no receptor: ${abs(I_r_complex).toFixed(3)} ∠ ${math.degrees(math.phase(I_r_complex)).toFixed(3)}° A</p>
                <p>Potência ativa transmitida: ${P_s.toFixed(1)} MW</p>
                <p>Potência reativa transmitida: ${Q_s.toFixed(1)} MVAr</p>
                <p>Potência ativa na carga: ${P_carga_MW.toFixed(1)} MW</p>
                <p>Potência reativa na carga: ${Q_carga_MVAr.toFixed(1)} MVAr</p>
                <p>Perdas ativas: ${P_perdas.toFixed(1)} MW</p>
                <p>Perdas reativas: ${Q_perdas.toFixed(1)} MVAr</p>
                <p>Rendimento: ${rendimento.toFixed(2)}%</p>
            `;

            // Reatância indutiva da linha
            const X_L = (omega * L * length);  // [Ω]

            // Reatância capacitiva de compensação (negativa)
            const X_comp_serie = -nivel_comp_serie * X_L;  // [Ω]

            // Nova impedância série após compensação
            const Z_comp_serie = math.complex(R * length, X_L + X_comp_serie);

            // Novo parâmetro B do quadripolo compensado
            const B_comp = Z_comp_serie;
            const A_comp = A;  // Permanece igual para compensação série pura
            const C_comp = C;  // Permanece igual para compensação série pura
            const D_comp = D;  // Permanece igual para compensação série pura

            // Recálculo com compensação série
            const I_s_comp = math.divide(math.subtract(V_s_complex, math.multiply(A_comp, V_r_complex)), B_comp);
            const S_s_comp = math.multiply(3, V_s_complex, math.conj(I_s_comp));
            const P_s_comp = S_s_comp.re / 1e6;
            const Q_s_comp = S_s_comp.im / 1e6;

            const P_perdas_comp = P_s_comp - P_carga_MW;
            const Q_perdas_comp = Q_s_comp - Q_carga_MVAr;
            const rendimento_comp = (P_carga_MW / P_s_comp) * 100;

            // Potência do capacitor série
            const P_capacitor_serie = math.divide(math.pow(abs(I_s_comp), 2), abs(X_comp_serie) * 1e6);  // [MW]

            // Display series compensation analysis results
            const seriesCompAnalysis = document.getElementById('series-comp-analysis');
            seriesCompAnalysis.innerHTML = `
                <p>Nível de compensação série: ${(nivel_comp_serie * 100).toFixed(1)}%</p>
                <p>Reatância indutiva original: ${X_L.toFixed(3)} Ω</p>
                <p>Reatância capacitiva de compensação: ${X_comp_serie.toFixed(3)} Ω</p>
                <p>Nova reatância série resultante: ${(X_L + X_comp_serie).toFixed(3)} Ω</p>
                <p>Corrente no transmissor (compensada): ${abs(I_s_comp).toFixed(3)} ∠ ${math.degrees(math.phase(I_s_comp)).toFixed(3)}° A</p>
                <p>Potência ativa transmitida: ${P_s_comp.toFixed(1)} MW</p>
                <p>Potência reativa transmitida: ${Q_s_comp.toFixed(1)} MVAr</p>
                <p>Perdas ativas (compensada): ${P_perdas_comp.toFixed(1)} MW</p>
                <p>Perdas reativas (compensada): ${Q_perdas_comp.toFixed(1)} MVAr</p>
                <p>Rendimento (compensado): ${rendimento_comp.toFixed(2)}%</p>
                <p>Potência do capacitor série: ${P_capacitor_serie.toFixed(1)} MW</p>
            `;

            // Susceptância capacitiva shunt para limitar tensão a 1.05 pu
            const V_max_V = tensao_max_pu * V_nominal * 1000 / Math.sqrt(3);  // [V]

            // Para cálculo simplificado da compensação shunt
            // Usamos a fórmula aproximada para compensação reativa
            const B_shunt = math.divide(math.subtract(abs(V_r_complex), V_max_V), math.multiply(V_max_V, abs(Z0)));  // [S]

            // Potência do reator shunt
            const Q_reator_shunt = math.multiply(3, V_r_complex, math.conj(V_r_complex), B_shunt) / 1e6;  // [MVAr]

            // Display shunt compensation results
            const technicalNotes = document.getElementById('technical-notes');
            technicalNotes.innerHTML = `
                <p>Tensão máxima permitida: ${tensao_max_pu.toFixed(2)} pu (${(V_max_V / 1000 * Math.sqrt(3)).toFixed(1)} kV)</p>
                <p>Susceptância shunt necessária: ${(B_shunt * 1e6).toFixed(3)} μS</p>
                <p>Potência reativa do reator shunt: ${Q_reator_shunt.re.toFixed(1)} MVAr</p>
            `;

            // Resumo comparativo
            const comparativeSummary = document.getElementById('comparative-summary');
            comparativeSummary.innerHTML = `
                <p>${'Parâmetro'.padEnd(30)} ${'Sem Comp.'.padEnd(12)} ${'Comp. Série'.padEnd(12)} Unidade</p>
                <p>${'-'.repeat(60)}</p>
                <p>${'Potência transmitida'.padEnd(30)} ${P_s.toFixed(1).padEnd(12)} ${P_s_comp.toFixed(1).padEnd(12)} MW</p>
                <p>${'Perdas ativas'.padEnd(30)} ${P_perdas.toFixed(1).padEnd(12)} ${P_perdas_comp.toFixed(1).padEnd(12)} MW</p>
                <p>${'Perdas reativas'.padEnd(30)} ${Q_perdas.toFixed(1).padEnd(12)} ${Q_perdas_comp.toFixed(1).padEnd(12)} MVAr</p>
                <p>${'Rendimento'.padEnd(30)} ${rendimento.toFixed(2).padEnd(12)} ${rendimento_comp.toFixed(2).padEnd(12)} %</p>
                <p>${'Corrente transmissor'.padEnd(30)} ${abs(I_s_complex).toFixed(1).padEnd(12)} ${abs(I_s_comp).toFixed(1).padEnd(12)} A</p>
            `;

            // Observações técnicas
            let observacoes = `
                • Linha classificada como: ${length > 240 ? 'LONGA' : length > 80 ? 'MÉDIA' : 'CURTA'}
                • Comprimento elétrico: ${abs(gamma_L).toFixed(3)} rad (${math.degrees(abs(gamma_L)).toFixed(1)}°)
                • Carregamento natural: ${((P_carga_MW / P_natural) * 100).toFixed(1)}% do SIL
                • Redução de perdas com compensação série: ${(((P_perdas - P_perdas_comp) / P_perdas) * 100).toFixed(1)}%
                • Melhoria no rendimento: ${(rendimento_comp - rendimento).toFixed(2)} pontos percentuais
            `;

            if (abs(gamma_L) > Math.PI / 4) {
                observacoes += `\n• ATENÇÃO: Linha eletricamente longa - considerar efeitos de onda estacionária`;
            }

            if (abs(V_r_complex) / 1000 * Math.sqrt(3) > tensao_max_pu * V_nominal) {
                observacoes += `\n• ATENÇÃO: Tensão no receptor excede limite máximo - compensação necessária`;
            }

            technicalNotes.innerHTML += `
                <h3>Observações Técnicas</h3>
                <pre>${observacoes}</pre>
            `;
        }
    </script>

    <style>
        .calculator-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: inline-block;
            width: 200px;
        }

        .form-group input {
            width: 150px;
            padding: 5px;
        }

        .results-section {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {

        }

        pre {
            background-color: #fff;

            overflow-x: auto;
        }
    </style>
</body>
</html>
